name: Snake

# Gera a animacao da cobrinha comendo o grafico de contribuicoes
# e publica os SVGs na branch `output`.
#
# Saida:
#   https://raw.githubusercontent.com/Matheush2ds/MatheusH2ds/output/github-snake.svg
#   https://raw.githubusercontent.com/Matheush2ds/MatheusH2ds/output/github-snake-dark.svg

on:
  schedule:
    - cron: "0 3 * * *"        # todo dia as 03:00 UTC (00:00 BRT)
  workflow_dispatch:            # botao "Run workflow" na aba Actions
  push:
    branches:
      - main

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Gerar SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
