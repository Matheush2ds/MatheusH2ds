name: Profile 3D Contrib

# Gera o histograma 3D de contribuicoes em ./profile-3d-contrib/
# e commita direto na branch main (por isso o README usa caminho relativo).

on:
  schedule:
    - cron: "0 4 * * *"        # todo dia as 04:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: profile-3d
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Gerar SVGs 3D
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commitar resultado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: atualiza profile-3d-contrib"
          git push
